version: 2
# Grouped, weekly, low-noise dependency updates for both the GitHub Actions
# SHA pins and the hex dep tree.
#
# commit-message.prefix MUST be a NON-release Conventional-Commits type
# (ci / build / chore) so dependabot PRs never trigger a spurious release-please
# minor. Groups bundle minor+patch updates for Actions and development
# Mix dependencies. Runtime Mix dependencies and all major bumps stay separate so
# their compatibility surface remains reviewable.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    # MuonTrap 2.x removes the v1-only cgroup options that lib/rindle/av/subprocess.ex
    # passes, so a semver-major bump breaks AV subprocess supervision. The ignore is
    # lifted only by a chartered cgroup-v2 migration.
    ignore:
      - dependency-name: "muontrap"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
