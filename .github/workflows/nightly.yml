name: Nightly

# Nightly lane (a separate file on purpose). A `schedule:` trigger on ci.yml
# is DISQUALIFYING: scheduled runs are named `CI` on head_branch main, which
# would fire release-please-automerge.yml's `on: workflow_run: workflows: [CI]`
# + `head_branch == 'main'` listener (no SHA/event filter) on a cron tick →
# it would `gh pr list` an eligible Release Please PR and auto-squash-merge it +
# dispatch release.yml → an UNATTENDED clock-triggered release, violating the
# "never weaken the release gate" invariant. A SEPARATE file with run name
# `Nightly` and a distinct workflow_id is invisible to all three release
# consumers (release-please-automerge workflow_run:[CI], release.yml
# gate-ci-green workflow_id:'ci.yml', branch-protection required-check set) and
# can NEVER become a PR required check (it has no PR-event trigger). Precedent:
# branch-protection-apply.yml is already a standalone scheduled workflow.
#
# cron 27 7 (07:27 UTC) — off-the-hour avoids the documented top-of-hour
# scheduled-run clustering/queue-drop; offset from branch-protection-apply.yml's
# `:17` for clean log separation in the same low-traffic UTC window.
on:
  schedule:
    - cron: '27 7 * * *'
    # Temporary recovery window: 2026-10-27 11:27 UTC. Annual until removed.
    # Remove this entry after the retained139-07 historical acceptance.
    - cron: '27 11 27 10 *'
  workflow_dispatch:

env:
  MIX_ENV: test

permissions:
  contents: read

# Nightly budgets include cold setup: 45m compatibility, 90m for independent
# fresh/restored PLTs, 60m for real-bucket soak, 30m consumer breadth, 5m metadata.
# Postgres service tags are an explicit exception: disposable test databases
# track patch updates within the supported 16-alpine family.
jobs:
  # Broad OTP×Elixir compatibility on a CURATED ~6-cell diagonal (NOT a
  # cartesian product — a cartesian/dynamic matrix is an explicit
  # anti-feature). fail-fast: false so one red cell never masks the others.
  # The 1.15/26 floor and 1.17/27 home cells deliberately straddle the mix.exs
  # json_polyfill_dep/0 `otp_major < 27` branch (mix.exs:135-141): OTP<27 pulls
  # {:json_polyfill, ...}, OTP>=27 does not. OTP 25 is not claimed because the
  # current JOSE dependency requires OTP 26+. 1.18/27 + 1.18/28 are the
  # newest/newest drift early-warning. 1.17/27 is the PR ceiling/home cell.
  compat-matrix:
    name: Compat Matrix
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    outputs:
      applicable: ${{ steps.nightly-evidence.outputs.applicable }}
      applicability-rule: ${{ steps.nightly-evidence.outputs.applicability-rule }}
      execution: ${{ steps.nightly-evidence.outputs.execution }}
      inapplicability-reason: ${{ steps.nightly-evidence.outputs.inapplicability-reason }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15"
            otp: "26"
          - elixir: "1.16"
            otp: "26"
          - elixir: "1.17"
            otp: "27" # PR ceiling / home cell
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.18"
            otp: "28" # newest/newest drift early-warning
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"
      RINDLE_AV_USE_CGROUPS: "false"

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rindle_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        id: setup
        # Reuse the setup-elixir composite (near-zero duplication). The
        # compat matrix spans toolchains the PR lane never installs, so the
        # composite's resolved-version-aware deps/_build cache keys give each
        # cell its own lineage (a cold first build per OTP/Elixir bump is fine
        # nightly). install-deps:false so this job runs its own plain deps.get
        # (no --check-locked: the json_polyfill conditional dep makes the
        # OTP27-resolved mix.lock unverifiable on OTP<27 cells — same reasoning
        # as ci.yml quality).
        uses: ./.github/actions/setup-elixir
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          mix-env: test
          install-deps: "false"

      - name: Install libvips
        run: bash scripts/ci/install_apt_packages.sh libvips-dev

      - name: Install FFmpeg
        # Reliable static ffmpeg >= 6 (apt only ships 4.4, below the >= 6.0 gate
        # in lib/rindle/av/probe.ex). See scripts/ci/install_ffmpeg.sh.
        run: bash scripts/ci/install_ffmpeg.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests with coverage
        run: mix coveralls

      # Advisory MuonTrap #98 probes. `--include canary`
      # opts in both the guarded stress probe and the raw cleanup canary;
      # `continue-on-error: true` keeps these probabilistic OS-race checks off
      # the merge gate. Both probes carry explicit execution budgets.
      - name: Subprocess :epipe cleanup canary (advisory)
        continue-on-error: true
        run: >-
          mix test
          test/rindle/av/subprocess_epipe_test.exs
          test/rindle/av/subprocess_epipe_canary_test.exs
          --include canary

      - name: Publish Nightly evidence
        id: nightly-evidence
        if: success()
        run: |
          {
            echo "applicable=true"
            echo "applicability-rule=always"
            echo "execution=passed"
            echo "inapplicability-reason="
          } >> "$GITHUB_OUTPUT"

  # Owned, GATING Dialyzer (not part of the PR lane). `mix dialyzer` runs
  # WITHOUT continue-on-error here, so a real type-contract regression or
  # .dialyzer_ignore.exs drift fails the nightly lane and the ignore baseline
  # cannot rot. MTTD ≈ 24h is acceptable for a contract-confidence
  # signal (the merge-blocking ExUnit suite still catches behavior on every PR).
  #
  # SINGLE-CELL job (1.17/27 home cell) — NOT a strategy.matrix. The requested
  # support labels remain fixed, while setup-elixir's exact installed patch
  # outputs identify the PLT bytes. Fresh and restored evidence are separate
  # commands so neither path can substitute for the other.
  dialyzer:
    name: Dialyzer
    timeout-minutes: 90
    runs-on: ubuntu-22.04
    outputs:
      applicable: ${{ steps.nightly-evidence.outputs.applicable }}
      applicability-rule: ${{ steps.nightly-evidence.outputs.applicability-rule }}
      execution: ${{ steps.nightly-evidence.outputs.execution }}
      inapplicability-reason: ${{ steps.nightly-evidence.outputs.inapplicability-reason }}
    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"
      RINDLE_AV_USE_CGROUPS: "false"

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rindle_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        id: setup
        uses: ./.github/actions/setup-elixir
        with:
          elixir-version: "1.17"
          otp-version: "27"
          mix-env: test
          install-deps: "false"

      - name: Install libvips
        run: bash scripts/ci/install_apt_packages.sh libvips-dev

      - name: Install dependencies
        run: mix deps.get

      # Cold construction is always exercised first and cannot consume a
      # restored PLT. The runner deletes only priv/plts, builds, then analyzes.
      - name: Dialyzer (fresh PLT)
        run: bash scripts/ci/run_nightly_dialyzer.sh fresh

      # Exact installed patch versions prevent the #93 PLT from being restored
      # under #101's newer OTP patch. Input hashes remain part of the identity,
      # and no restore prefix permits a cross-toolchain or cross-input fallback.
      - name: Save PLT cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plt-v3-${{ runner.os }}-${{ runner.arch }}-otp${{ steps.setup.outputs.resolved-otp-version }}-elixir${{ steps.setup.outputs.resolved-elixir-version }}-${{ hashFiles('mix.exs', 'mix.lock', '.dialyzer_ignore.exs') }}

      - name: Remove fresh PLT before restore proof
        run: rm -rf priv/plts

      - name: Restore exact PLT cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: plt_cache
        with:
          path: priv/plts
          key: plt-v3-${{ runner.os }}-${{ runner.arch }}-otp${{ steps.setup.outputs.resolved-otp-version }}-elixir${{ steps.setup.outputs.resolved-elixir-version }}-${{ hashFiles('mix.exs', 'mix.lock', '.dialyzer_ignore.exs') }}

      - name: Require exact PLT restore
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: |
          echo "Exact PLT cache restore failed; restored evidence cannot be substituted." >&2
          exit 1

      # Valid restores analyze directly. Only the exact observed old-PLT
      # fingerprint gets one local rebuild; warnings and unknown failures stay red.
      - name: Dialyzer (restored PLT)
        run: bash scripts/ci/run_nightly_dialyzer.sh restored

      - name: Publish Nightly evidence
        id: nightly-evidence
        if: success()
        run: |
          {
            echo "applicable=true"
            echo "applicability-rule=always"
            echo "execution=passed"
            echo "inapplicability-reason="
          } >> "$GITHUB_OUTPUT"

  # GCS Soak — real bucket proof. A first step machine-checks upstream-repository identity plus
  # required-secret presence, and every live step is gated on that result. The
  # final evidence step distinguishes a passed live run from explicit `not-run`.
  # The `mix test --only gcs` step is GATING (no continue-on-error) so a
  # live-GCS regression is real nightly red surfaced via Nightly Summary +
  # nightly-failure-issue.
  gcs-soak:
    name: GCS Soak (real bucket)
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    outputs:
      applicable: ${{ steps.nightly-evidence.outputs.applicable }}
      applicability-rule: ${{ steps.nightly-evidence.outputs.applicability-rule }}
      execution: ${{ steps.nightly-evidence.outputs.execution }}
      inapplicability-reason: ${{ steps.nightly-evidence.outputs.inapplicability-reason }}
    env:
      MIX_ENV: test
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      RINDLE_GCS_BUCKET: ${{ secrets.RINDLE_GCS_BUCKET }}
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rindle_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine live GCS applicability
        id: gcs-live-config
        env:
          UPSTREAM_REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "applicability-rule=upstream-repository-and-required-secrets"
            if [ "${UPSTREAM_REPOSITORY}" != "szTheory/rindle" ]; then
              echo "enabled=false"
              echo "applicable=false"
              echo "reason=not-upstream-repository"
            elif [ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" ] || [ -z "${RINDLE_GCS_BUCKET}" ]; then
              echo "enabled=false"
              echo "applicable=false"
              echo "reason=required-secrets-unavailable"
            else
              echo "enabled=true"
              echo "applicable=true"
              echo "reason="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Skip live GCS soak when secrets are unavailable
        if: steps.gcs-live-config.outputs.enabled != 'true'
        run: |
          echo "Skipping live GCS soak: GOOGLE_APPLICATION_CREDENTIALS_JSON and/or RINDLE_GCS_BUCKET are not configured."

      - name: Set up Elixir
        if: steps.gcs-live-config.outputs.enabled == 'true'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Install libvips
        if: steps.gcs-live-config.outputs.enabled == 'true'
        run: bash scripts/ci/install_apt_packages.sh libvips-dev

      - name: Install dependencies
        if: steps.gcs-live-config.outputs.enabled == 'true'
        run: mix deps.get

      # GATING in nightly (no continue-on-error) so a real GCS regression is a
      # real nightly red.
      - name: Run GCS integration tests
        if: steps.gcs-live-config.outputs.enabled == 'true'
        run: mix test --only gcs

      - name: Publish Nightly evidence
        id: nightly-evidence
        if: success()
        run: |
          {
            echo "applicable=${{ steps.gcs-live-config.outputs.applicable }}"
            echo "applicability-rule=${{ steps.gcs-live-config.outputs.applicability-rule }}"
            if [ "${{ steps.gcs-live-config.outputs.enabled }}" = "true" ]; then
              echo "execution=passed"
            else
              echo "execution=not-run"
            fi
            echo "inapplicability-reason=${{ steps.gcs-live-config.outputs.reason }}"
          } >> "$GITHUB_OUTPUT"

  # Package Consumer GCS Live Proof. The job has no `continue-on-error`, so a
  # live-GCS install-smoke failure is real nightly signal rather than a masked
  # pass. The job still runs on forks so it can publish explicit
  # repository/secret inapplicability, but no live-provider step runs there.
  package-consumer-gcs-live:
    name: Package Consumer GCS Live Proof
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    outputs:
      applicable: ${{ steps.nightly-evidence.outputs.applicable }}
      applicability-rule: ${{ steps.nightly-evidence.outputs.applicability-rule }}
      execution: ${{ steps.nightly-evidence.outputs.execution }}
      inapplicability-reason: ${{ steps.nightly-evidence.outputs.inapplicability-reason }}
    env:
      MIX_ENV: test
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      RINDLE_GCS_BUCKET: ${{ secrets.RINDLE_GCS_BUCKET }}
      RINDLE_INSTALL_SMOKE_GCS_PREFIX: gcs-${{ github.run_id }}-${{ github.run_attempt }}
      RINDLE_INSTALL_SMOKE_GCS_CLEANUP_FILE: .tmp/install-smoke-gcs-cleanup.txt
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rindle_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine live GCS applicability
        id: gcs-live-config
        env:
          UPSTREAM_REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "applicability-rule=upstream-repository-and-required-secrets"
            if [ "${UPSTREAM_REPOSITORY}" != "szTheory/rindle" ]; then
              echo "enabled=false"
              echo "applicable=false"
              echo "reason=not-upstream-repository"
            elif [ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" ] || [ -z "${RINDLE_GCS_BUCKET}" ]; then
              echo "enabled=false"
              echo "applicable=false"
              echo "reason=required-secrets-unavailable"
            else
              echo "enabled=true"
              echo "applicable=true"
              echo "reason="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Skip live package-consumer GCS proof when secrets are unavailable
        if: steps.gcs-live-config.outputs.enabled != 'true'
        run: |
          echo "Skipping live package-consumer GCS proof: GOOGLE_APPLICATION_CREDENTIALS_JSON and/or RINDLE_GCS_BUCKET are not configured."

      - name: Set up Elixir
        # Composite setup + deps/_build cache, carrying the same
        # secret-gated `enabled == 'true'` guard so it never runs on a fork PR
        # without GCS secrets. install-deps:false keeps this job's own
        # enabled-gated `mix deps.get`.
        if: steps.gcs-live-config.outputs.enabled == 'true'
        uses: ./.github/actions/setup-elixir
        with:
          elixir-version: "1.17"
          otp-version: "27"
          mix-env: test
          install-deps: "false"

      - name: Install libvips
        if: steps.gcs-live-config.outputs.enabled == 'true'
        run: bash scripts/ci/install_apt_packages.sh libvips-dev

      - name: Install dependencies
        if: steps.gcs-live-config.outputs.enabled == 'true'
        run: mix deps.get

      - name: Authenticate for live GCS proof cleanup
        if: steps.gcs-live-config.outputs.enabled == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Set up gcloud for live GCS cleanup
        if: steps.gcs-live-config.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Run live package-consumer GCS resumable proof without logging raw session_uri values
        if: steps.gcs-live-config.outputs.enabled == 'true'
        run: bash scripts/install_smoke.sh gcs

      - name: Adoption demo GCS live companion (documented lane; install_smoke is canonical)
        if: steps.gcs-live-config.outputs.enabled == 'true'
        run: bash scripts/ci/adoption_demo_gcs_live.sh

      - name: Always clean up live package-consumer GCS objects for this prefix
        if: ${{ always() && steps.gcs-live-config.outputs.enabled == 'true' }}
        run: |
          if [ -z "${RINDLE_GCS_BUCKET}" ] || [ ! -f "${RINDLE_INSTALL_SMOKE_GCS_CLEANUP_FILE}" ]; then
            exit 0
          fi

          while IFS= read -r upload_key; do
            if [ -n "${upload_key}" ]; then
              gcloud storage rm "gs://${RINDLE_GCS_BUCKET}/${upload_key}" || true
            fi
          done < "${RINDLE_INSTALL_SMOKE_GCS_CLEANUP_FILE}"

      - name: Publish Nightly evidence
        id: nightly-evidence
        if: success()
        run: |
          {
            echo "applicable=${{ steps.gcs-live-config.outputs.applicable }}"
            echo "applicability-rule=${{ steps.gcs-live-config.outputs.applicability-rule }}"
            if [ "${{ steps.gcs-live-config.outputs.enabled }}" = "true" ]; then
              echo "execution=passed"
            else
              echo "execution=not-run"
            fi
            echo "inapplicability-reason=${{ steps.gcs-live-config.outputs.reason }}"
          } >> "$GITHUB_OUTPUT"

  # Nightly has its own strict, fail-closed result/applicability
  # policy. Its machine verdict is exported for incident eligibility and also
  # controls this job's conclusion; Markdown is only a rendering of that verdict.
  nightly-summary:
    name: Nightly Summary
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    needs:
      - compat-matrix
      - dialyzer
      - gcs-soak
      - package-consumer-gcs-live
    if: always()
    outputs:
      verdict: ${{ steps.evaluate.outputs.verdict }}
      verdict-json: ${{ steps.evaluate.outputs.verdict-json }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Evaluate strict Nightly verdict
        id: evaluate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          NIGHTLY_POLICY_JSON: >-
            {"compat-matrix":{"applicable":${{ needs.compat-matrix.outputs.applicable }},"applicability_rule":"${{ needs.compat-matrix.outputs.applicability-rule }}","execution":"${{ needs.compat-matrix.outputs.execution }}","reason":"${{ needs.compat-matrix.outputs.inapplicability-reason }}"},"dialyzer":{"applicable":${{ needs.dialyzer.outputs.applicable }},"applicability_rule":"${{ needs.dialyzer.outputs.applicability-rule }}","execution":"${{ needs.dialyzer.outputs.execution }}","reason":"${{ needs.dialyzer.outputs.inapplicability-reason }}"},"gcs-soak":{"applicable":${{ needs.gcs-soak.outputs.applicable }},"applicability_rule":"${{ needs.gcs-soak.outputs.applicability-rule }}","execution":"${{ needs.gcs-soak.outputs.execution }}","reason":"${{ needs.gcs-soak.outputs.inapplicability-reason }}"},"package-consumer-gcs-live":{"applicable":${{ needs.package-consumer-gcs-live.outputs.applicable }},"applicability_rule":"${{ needs.package-consumer-gcs-live.outputs.applicability-rule }}","execution":"${{ needs.package-consumer-gcs-live.outputs.execution }}","reason":"${{ needs.package-consumer-gcs-live.outputs.inapplicability-reason }}"}}
        run: |
          verdict_path="${RUNNER_TEMP}/nightly-verdict.json"
          status=0
          NIGHTLY_VERDICT_JSON="${verdict_path}" bash scripts/ci/eval_nightly_summary.sh >/dev/null || status=$?
          verdict_json="$(jq -cS . "${verdict_path}")"
          verdict="$(jq -r .verdict "${verdict_path}")"
          {
            echo "verdict=${verdict}"
            echo "verdict-json=${verdict_json}"
            echo "evaluator-status=${status}"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce strict Nightly verdict
        run: |
          test "${{ steps.evaluate.outputs.evaluator-status }}" = "0"
          test "${{ steps.evaluate.outputs.verdict }}" = "green"

  # Every scheduled run publishes its strict verdict before entering the
  # replaceable pending slot. Verdict artifacts are immutable replay inputs;
  # a separate authenticated checkpoint artifact bounds retention replay.
  nightly-incident-verdict:
    name: Persist Nightly Incident Verdict
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    needs: nightly-summary
    if: ${{ always() && github.event_name == 'schedule' }}
    permissions:
      contents: read
    steps:
      - name: Write immutable Nightly verdict event
        env:
          STRICT_VERDICT_JSON: ${{ needs.nightly-summary.outputs.verdict-json }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_REF: ${{ github.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail

          [[ "${RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "${RUN_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RUN_REF}" =~ ^refs/heads/[A-Za-z0-9._/-]{1,100}$ ]]
          [[ "${RUN_URL}" = "https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}" ]]
          [[ "${WORKFLOW_NAME}" = "Nightly" ]]
          [[ "${WORKFLOW_REF}" = "${REPOSITORY}/.github/workflows/nightly.yml@${RUN_REF}" ]]
          jq -e '
            type == "object" and
            (.verdict | IN("red", "green")) and
            (.jobs | type == "array" and length > 0) and
            (.errors | type == "array")
          ' >/dev/null <<<"${STRICT_VERDICT_JSON}"

          verdict_path="${RUNNER_TEMP}/nightly-incident-verdict.json"
          jq -cS -n \
            --arg schema "rindle-nightly-incident-verdict-v1" \
            --arg repository "${REPOSITORY}" \
            --arg workflow_name "${WORKFLOW_NAME}" \
            --arg workflow_ref "${WORKFLOW_REF}" \
            --arg event "schedule" \
            --argjson run_id "${RUN_ID}" \
            --argjson run_attempt "${RUN_ATTEMPT}" \
            --arg sha "${RUN_SHA}" \
            --arg ref "${RUN_REF}" \
            --arg url "${RUN_URL}" \
            --argjson verdict "${STRICT_VERDICT_JSON}" \
            '{schema:$schema,repository:$repository,workflow_name:$workflow_name,workflow_ref:$workflow_ref,event:$event,run_id:$run_id,run_attempt:$run_attempt,sha:$sha,ref:$ref,url:$url,verdict:$verdict}' \
            >"${verdict_path}"
          jq -e ".run_id == ${RUN_ID} and .run_attempt == ${RUN_ATTEMPT}" "${verdict_path}" >/dev/null

      - name: Upload immutable Nightly verdict event
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-incident-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-incident-verdict.json
          retention-days: 14
          if-no-files-found: error
          overwrite: false

  # The latest surviving scheduled drainer replays the immutable
  # event log. `cancel-in-progress: false` protects its current mutation while
  # the pre-gate artifact preserves any replaced pending run's verdict.
  nightly-failure-issue:
    name: Nightly Incident Lifecycle
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    needs: nightly-incident-verdict
    if: ${{ always() && github.event_name == 'schedule' }}
    concurrency:
      group: nightly-incident-${{ github.repository }}-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve current remote default-branch SHA
        id: remote-main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          remote_main_sha="$(
            gh api --method GET \
              "repos/${GH_REPO}/git/ref/heads/${DEFAULT_BRANCH}" \
              --jq '.object.sha'
          )"
          [[ "${remote_main_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${remote_main_sha}" >> "$GITHUB_OUTPUT"

      - name: Manage scheduled Nightly incident
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REMOTE_MAIN_SHA: ${{ steps.remote-main.outputs.sha }}
          CHECKPOINT_OUTPUT_PATH: ${{ runner.temp }}/nightly-incident-checkpoint.json
        run: bash scripts/ci/manage_nightly_incident.sh

      - name: Upload authenticated Nightly replay checkpoint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-incident-replay-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-incident-checkpoint.json
          retention-days: 14
          if-no-files-found: error
          overwrite: false
